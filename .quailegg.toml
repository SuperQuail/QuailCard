# Generated by qegg. Keep this file in version control.
schema_version = 1

[project]
default_branch = "main"
repo = "github.com/SuperQuail/QuailCard"

[git]
tag_prefix = "app-v"
remote = "origin"

[release]
mode = "pr"
branch = "qegg-release"
github_release = true
commit_message = "chore(release): app-v{{version}}"
version_scope = "package"

[changes]
dir = ".changes"
scope = ["src", "src-tauri/src"]

[verify]
commands = ["pnpm typecheck", "pnpm test", "cargo test --manifest-path src-tauri/Cargo.toml"]
timeout = "30m"
fail_fast = true

[release.workflow]
runner = "ubuntu-22.04"
timeout_minutes = 90
yaml = """
- name: 固定发布日志语言
  run: echo "QEGG_LANG=zh" >> "$GITHUB_ENV"
- uses: pnpm/action-setup@v4
  with: { version: 9 }
- uses: actions/setup-node@v6
  with:
    node-version: lts/*
    cache: pnpm
- name: 安装 Tauri Linux 系统依赖
  run: |
    sudo apt-get update
    sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils build-essential cmake git pkg-config perl
- name: 准备随包资源（词典 / ffmpeg / whisper）
  run: |
    bash ./scripts/fetch-ecdict.sh
    bash ./scripts/fetch-ffmpeg.sh
    bash ./scripts/fetch-whisper.sh
- run: pnpm install --frozen-lockfile
"""

[publish]
registries = []

[packages.quailcard]
path = "src-tauri"
resolver = "rust"
publish = false

[[version.file]]
path = "package.json"
format = "json"
key = "version"

[[release.build]]
name = "windows"
runner = "windows-2022"
yaml = """
- uses: actions/checkout@v4
  with: { fetch-depth: 0 }
- uses: pnpm/action-setup@v4
  with: { version: 9 }
- uses: actions/setup-node@v6
  with:
    node-version: lts/*
    cache: pnpm
- uses: dtolnay/rust-toolchain@stable
- uses: swatinem/rust-cache@v2
  with: { workspaces: './ -> target' }
- uses: actions/cache@v4
  with:
    path: |
      src-tauri/resources/ffmpeg
      src-tauri/resources/whisper
    key: quailcard-components-windows-ffmpeg-unix7.1.1-aom3.12.1-win20260911-lgpl-av1-v4-whisper-1.7.6-${{ hashFiles('scripts/fetch-ffmpeg.*', 'scripts/fetch-whisper.*', 'scripts/component-*') }}
- uses: actions/setup-python@v6
  with: { python-version: '3.12' }
- name: 检查解包工具
  shell: pwsh
  run: |
    Get-Command 7z -ErrorAction Stop
    python --version
- name: 准备随包组件与词典
  shell: pwsh
  run: |
    pwsh ./scripts/fetch-ffmpeg.ps1
    pwsh ./scripts/fetch-whisper.ps1
    pwsh ./scripts/fetch-ecdict.ps1
- run: pnpm install --frozen-lockfile
- run: pnpm tauri build
- name: 收集安装包
  shell: bash
  run: bash ./scripts/collect-bundles.sh dist
"""
artifacts = ["dist/*"]

[[release.build]]
name = "macos-arm64"
runner = "macos-latest"
yaml = """
- uses: actions/checkout@v4
  with: { fetch-depth: 0 }
- uses: pnpm/action-setup@v4
  with: { version: 9 }
- uses: actions/setup-node@v6
  with:
    node-version: lts/*
    cache: pnpm
- uses: dtolnay/rust-toolchain@stable
  with:
    targets: aarch64-apple-darwin,x86_64-apple-darwin
- uses: swatinem/rust-cache@v2
  with: { workspaces: './ -> target' }
- uses: actions/cache@v4
  with:
    path: |
      src-tauri/resources/ffmpeg
      src-tauri/resources/whisper
    key: quailcard-components-macos-ffmpeg-unix7.1.1-aom3.12.1-win20260911-lgpl-av1-v4-whisper-1.7.6-${{ hashFiles('scripts/fetch-ffmpeg.*', 'scripts/fetch-whisper.*', 'scripts/component-*') }}
- run: command -v pkg-config >/dev/null || brew install pkg-config
- name: 准备随包组件与词典
  run: |
    bash ./scripts/fetch-ffmpeg.sh
    bash ./scripts/fetch-whisper.sh
    bash ./scripts/fetch-ecdict.sh
- run: pnpm install --frozen-lockfile
- run: pnpm tauri build --target aarch64-apple-darwin
- name: 收集安装包
  run: bash ./scripts/collect-bundles.sh dist
"""
artifacts = ["dist/*"]

