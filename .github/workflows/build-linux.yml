name: build Linux

# 手动构建 Linux 安装包，不创建 Release；适合 Fork 后按需生成 artifact。
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 构建架构
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux ${{ inputs.architecture }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    env:
      TARGET_ARCH: ${{ inputs.architecture == 'arm64' && 'arm64' || 'x86_64' }}
      COMPONENT_FLAVOR: cpu-baseline
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils build-essential cmake git pkg-config perl

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 缓存随包组件
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/ffmpeg
            src-tauri/resources/whisper
          key: quailcard-components-${{ runner.os }}-${{ env.TARGET_ARCH }}-ffmpeg-unix7.1.1-aom3.12.1-win20260911-lgpl-av1-v4-whisper-1.7.6-${{ env.COMPONENT_FLAVOR }}-${{ hashFiles('scripts/fetch-ffmpeg.*', 'scripts/fetch-whisper.*', 'scripts/component-*') }}

      - name: 准备随包组件（ffmpeg / whisper-cli）
        run: |
          bash ./scripts/fetch-ffmpeg.sh
          bash ./scripts/fetch-whisper.sh

      - name: 拉取内置 ECDICT 词典
        run: bash ./scripts/fetch-ecdict.sh

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Linux 安装包
        run: pnpm tauri build

      - name: 上传 Linux 安装包
        uses: actions/upload-artifact@v6
        with:
          name: quailcard-linux-${{ inputs.architecture }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14