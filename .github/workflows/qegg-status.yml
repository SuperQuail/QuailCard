name: QuailEgg Status
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@latest
      - run: qegg status --json
