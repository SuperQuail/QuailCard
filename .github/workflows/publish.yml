name: publish

# 发布工作流：参考 tauri-apps/tauri-action 官方模板，按本项目实际适配：
# - 包管理器是 pnpm（setup-node 缓存前必须先装 pnpm，否则 cache 解析失败）。
# - 打包需要内置 ECDICT 词典（tauri.conf.json 的 resources 引用），构建前必须先拉取。
# - macOS 拆分 Arm / Intel 双 target；暂不发布 Linux 安装包。
on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Arm 架构 Mac（M1 及以上）。
            args: '--target aarch64-apple-darwin'
            target_arch: arm64
            component_flavor: cpu-baseline-metal
          - platform: 'macos-latest' # Intel 架构 Mac。
            args: '--target x86_64-apple-darwin'
            target_arch: x86_64
            component_flavor: cpu-baseline
          - platform: 'windows-2022'
            args: ''
            target_arch: x86_64
            component_flavor: vulkan-cpu-baseline

    runs-on: ${{ matrix.platform }}
    env:
      TARGET_ARCH: ${{ matrix.target_arch }}
      COMPONENT_FLAVOR: ${{ matrix.component_flavor }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        # setup-node 的 cache: pnpm 依赖 pnpm 已在 PATH 中，必须放在其前一步。
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # 双 target 只有 macOS runner 用到，加 if 条件略微加速其余平台。
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          # 与 tauri 默认工程布局一致（src-tauri 为 Rust workspace）。
          workspaces: './src-tauri -> target'

      - name: 缓存随包组件
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/ffmpeg
            src-tauri/resources/whisper
          key: quailcard-components-${{ runner.os }}-${{ env.TARGET_ARCH }}-ffmpeg-unix7.1.1-aom3.12.1-win20260911-lgpl-av1-v4-whisper-1.7.6-${{ env.COMPONENT_FLAVOR }}-${{ hashFiles('scripts/fetch-ffmpeg.*', 'scripts/fetch-whisper.*', 'scripts/component-*') }}

      - name: 安装 Windows Python（Vulkan SDK 解包）
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 检查 Windows 解包工具
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command 7z -ErrorAction Stop
          python --version

      - name: 安装 macOS 源码构建工具
        if: runner.os == 'macOS'
        run: command -v pkg-config >/dev/null || brew install pkg-config

      - name: 准备随包组件（ffmpeg / whisper-cli）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh ./scripts/fetch-ffmpeg.ps1
            pwsh ./scripts/fetch-whisper.ps1
          else
            bash ./scripts/fetch-ffmpeg.sh
            bash ./scripts/fetch-whisper.sh
          fi

      - name: 拉取内置 ECDICT 词典
        # tauri.conf.json 的 resources 引用 resources/ecdict.db，缺失会导致打包失败。
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh ./scripts/fetch-ecdict.ps1
          else
            bash ./scripts/fetch-ecdict.sh
          fi

      - name: 安装前端依赖
        # beforeBuildCommand（pnpm build）由 tauri-action 触发，这里只需装好依赖。
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # __VERSION__ 会被自动替换为应用版本号。
          releaseName: 'QuailCard v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}