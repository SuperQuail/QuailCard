[package]
name = "quailcard"
version = "0.4.0"
description = "AI-powered learning card desktop application"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quailcard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
md-5 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.10"
ring = "0.17.14"
zeroize = "1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.33"
rand = "0.8"
toml = "1.1.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 删除默认走系统回收站；固定版本避免上游行为漂移影响删除语义。
trash = { version = "=5.2.9", default-features = false, features = ["coinit_multithreaded"] }
# frontmatter 只做容错读取；固定版本避免上游解析行为漂移改写用户笔记。
yaml-rust2 = "=0.13.0"
# 图片右键菜单：位图写入系统剪贴板，需要独立解码 PNG/JPEG/WebP。
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
# 并发与退避测试使用虚拟时钟，不依赖真实等待时长。
tokio = { version = "1", features = ["test-util"] }
